# Reveal.js Basics

- HTML presentation framework  
- Supports:
  - Markdown
  - Themes
  - Plugins
- Keyboard navigation:
  - Left/Right → horizontal
  - Up/Down → vertical

---

# Slide Structure

- **Horizontal slides:** separated by `---`
- **Vertical slides:** separated by `--` under the same parent

---

# Example: Vertical Slide Group

## Main Topic (Horizontal)

- This is the **parent** slide  
- Press **Down** to see details

--

## Detail 1 (Vertical)

- First vertical slide under “Main Topic”  
- You can add bullet points, code, etc.

--

## Detail 2 (Vertical)

- Second vertical slide  
- More explanation or examples

---

# Images Example

![Sample Image](https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Placeholder_view_vector.svg/512px-Placeholder_view_vector.svg.png)

- Use standard markdown image syntax:
  - `![alt text](image-url)`
- You can host images:
  - On the web (like above)

<!-- Reveal.js core JS -->
<script src="https://unpkg.com/reveal.js/dist/reveal.js"></script>

<!-- Plugins -->
<script src="https://unpkg.com/reveal.js/plugin/markdown/markdown.js"></script>
<script src="https://unpkg.com/reveal.js/plugin/highlight/highlight.js"></script>
<script src="https://unpkg.com/reveal.js/plugin/notes/notes.js"></script>

<script>
  Reveal.initialize({
    hash: true,
    controls: true,
    progress: true,
    slideNumber: true,
    center: true,
    plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
  });
</script>
